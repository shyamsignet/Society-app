name: Test & deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  database-security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: pg
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: psql -q -v ON_ERROR_STOP=1 -f supabase/test/supabase-stub.sql -f supabase/setup.sql
      - run: npm run test:db

  build:
    needs: database-security-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set these under Settings → Secrets and variables → Actions → Variables.
          # Leave them empty to publish the offline demo.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_SOCIETY_CODE: ${{ vars.SOCIETY_CODE }}
          VITE_SOCIETY_NAME: ${{ vars.SOCIETY_NAME }}
      # Sample-society demo for sales meetings, served from /demo/ (no backend, data stays on the phone)
      - run: npx vite build --outDir dist/demo
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
          VITE_SOCIETY_CODE: ''
          VITE_SOCIETY_NAME: ''
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only the default branch is published
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
